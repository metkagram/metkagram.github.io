name: Generate structural pattern aliases

on:
  push:
    branches: [fix/dedupe-structural-patterns]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/generate-pattern-aliases.mjs
      - name: Commit alias registry
        run: |
          if git diff --quiet -- data/pattern-aliases.json; then
            echo "Pattern alias registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pattern-aliases.json
          git commit -m "data: canonicalize structural pattern aliases"
          git push origin HEAD:${GITHUB_REF_NAME}
