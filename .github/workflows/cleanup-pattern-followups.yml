name: Cleanup generated pattern follow-ups

on:
  push:
    branches: [fix/remove-generated-example-tails]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/enrich-short-pattern-examples.mjs
      - name: Commit cleaned shards
        run: |
          if git diff --quiet -- data/patterns; then
            echo "No generated follow-ups found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/patterns
          git commit -m "data: remove generated pattern follow-up tails"
          git push origin HEAD:${GITHUB_REF_NAME}
