name: Corpus review snapshot
on:
  push:
    branches: [fix/corpus-language-quality-20260918]
permissions:
  contents: read
jobs:
  language-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Start pinned local proofreading service
        run: |
          curl --fail --location --retry 2 --max-time 180 https://languagetool.org/download/LanguageTool-6.6.zip -o /tmp/LanguageTool-6.6.zip
          echo '53600506b399bb5ffe1e4c8dec794fd378212f14aaf38ccef9b6f89314d11631  /tmp/LanguageTool-6.6.zip' | sha256sum --check
          unzip -q /tmp/LanguageTool-6.6.zip -d /tmp
          printf 'maxTextLength=100000\nmaxCheckTimeMillis=180000\nmaxCheckThreads=2\ncacheSize=2000\n' > /tmp/languagetool.properties
          java -Xmx4g -cp /tmp/LanguageTool-6.6/languagetool-server.jar org.languagetool.server.HTTPServer --port 8081 --config /tmp/languagetool.properties > /tmp/languagetool.log 2>&1 &
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8081/v2/languages > /dev/null && break; sleep 1; done
      - name: Scan all inventoried learner text without applying suggestions
        run: python3 scripts/review/corpus_language_audit.py --endpoint http://127.0.0.1:8081 --output reports/corpus-language-tool-audit.json
      - name: Archive tracked source and audit result
        if: always()
        run: |
          git archive --format=tar HEAD | gzip > /tmp/metkagram-review-source.tar.gz
          cp reports/corpus-language-tool-audit.json /tmp/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metkagram-language-review
          path: |
            /tmp/metkagram-review-source.tar.gz
            /tmp/corpus-language-tool-audit.json
            /tmp/languagetool.log
          retention-days: 3
