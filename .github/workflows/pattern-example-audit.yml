name: Pattern example audit

on:
  push:
    branches:
      - chore/pattern-example-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize pattern example counts
        run: node scripts/normalize-pattern-example-counts.mjs
      - name: Audit pattern example counts
        run: node --test tests/pattern-example-count.test.mjs
      - name: Commit normalized canonical patterns
        run: |
          if git diff --quiet -- data/patterns; then
            echo "Canonical pattern examples already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/patterns
          git commit -m "data: normalize pattern examples to seven"
          git push
