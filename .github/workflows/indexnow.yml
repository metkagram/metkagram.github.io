name: IndexNow

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 50
      - name: Submit changed discovery URLs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          KEY="0b259e71510ed24d1bbcf3dac08ec322"
          HOST="metkagram.github.io"
          BASE="https://${HOST}"

          PREVIOUS_DEPLOY_SHA="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?branch=main&status=success&per_page=20" \
              | jq -r --arg current "$DEPLOY_SHA" '.workflow_runs[] | select(.head_sha != $current) | .head_sha' \
              | head -n 1
          )"

          if [[ -n "$PREVIOUS_DEPLOY_SHA" ]] && git cat-file -e "${PREVIOUS_DEPLOY_SHA}^{commit}" 2>/dev/null; then
            echo "Comparing deployed revisions ${PREVIOUS_DEPLOY_SHA}..${DEPLOY_SHA}"
            CHANGED="$(git diff --name-only "$PREVIOUS_DEPLOY_SHA" "$DEPLOY_SHA" || true)"
          else
            echo "Previous deployed revision unavailable locally; falling back to the latest commit."
            CHANGED="$(git diff --name-only HEAD^ HEAD || true)"
          fi

          declare -a URLS=()

          add_url() {
            local candidate="$1"
            for existing in "${URLS[@]:-}"; do
              [[ "$existing" == "$candidate" ]] && return
            done
            URLS+=("$candidate")
          }

          if grep -Eq '^(src/mcp-page\.mjs|scripts/search-discovery\.mjs|public/connectors/metkagram-mcp\.mjs|src/api\.mjs)' <<<"$CHANGED"; then
            add_url "$BASE/en/mcp/"
            add_url "$BASE/ru/mcp/"
            add_url "$BASE/api/v1/discovery.json"
            add_url "$BASE/data/discovery.json"
            add_url "$BASE/llms.txt"
          fi

          if grep -Eq '^(data/(advanced-patterns|study-sets|practice-extensions)\.json|data/reasoning-frames/.*\.json|scripts/(add-|expand-|enrich-|public-learning|active-practice|practice-seo\.mjs)|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/practice/"
            add_url "$BASE/ru/practice/"
            add_url "$BASE/api/v1/patterns.json"
            add_url "$BASE/data/practice-navigation.json"
            while IFS= read -r set_id; do
              [[ -z "$set_id" ]] && continue
              set_slug="$(tr '[:upper:]' '[:lower:]' <<<"$set_id")"
              add_url "$BASE/en/practice/set/$set_slug/"
              add_url "$BASE/ru/practice/set/$set_slug/"
            done < <(
              jq -r '.sets[].id' data/study-sets.json
              [[ -f data/practice-extensions.json ]] && jq -r '.sets[].id' data/practice-extensions.json
            )

            while IFS= read -r frame_file; do
              [[ -f "$frame_file" ]] || continue
              while IFS= read -r pattern_id; do
                [[ -z "$pattern_id" ]] && continue
                pattern_slug="$(tr '[:upper:]' '[:lower:]' <<<"$pattern_id")"
                add_url "$BASE/en/practice/$pattern_slug/"
                add_url "$BASE/ru/practice/$pattern_slug/"
                add_url "$BASE/api/v1/patterns/$pattern_slug.json"
              done < <(jq -r '.[].id // empty' "$frame_file")
            done < <(grep -E '^data/reasoning-frames/.*\.json$' <<<"$CHANGED" || true)
          fi

          if grep -Eq '^(src/intents\.mjs|src/intent-|scripts/intent-discovery\.mjs)' <<<"$CHANGED"; then
            add_url "$BASE/en/practice/intents/"
            add_url "$BASE/ru/practice/intents/"
            add_url "$BASE/data/intents.json"
          fi

          if grep -Eq '^(data/discovery-topics(-extension(-[a-z0-9-]+)?)?\.json|src/discovery-pages\.mjs|scripts/(discovery-growth|practice-intent-growth)\.mjs|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/patterns/"
            add_url "$BASE/ru/patterns/"
            for topic_file in data/discovery-topics*.json; do
              [[ -f "$topic_file" ]] || continue
              while IFS= read -r slug; do
                [[ -z "$slug" ]] && continue
                add_url "$BASE/en/patterns/$slug/"
                add_url "$BASE/ru/patterns/$slug/"
              done < <(jq -r '.topics[].slug' "$topic_file")
            done
            add_url "$BASE/data/discovery-topics.json"
          fi

          if grep -Eq '^(data/language-pilots/.*\.json|src/(language-registry|domain-model)\.mjs|scripts/multilingual-domain-model\.mjs|docs/(LANGUAGE_ARCHITECTURE|ADDING_A_LANGUAGE)\.md|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/practice/language/french/"
            add_url "$BASE/ru/practice/language/french/"
            add_url "$BASE/en/data/"
            add_url "$BASE/ru/data/"
            add_url "$BASE/data/domain/index.json"
            add_url "$BASE/data/domain/language-pilots.json"
            add_url "$BASE/api/v1/domain-model.json"
            add_url "$BASE/api/v1/language-pilots.json"
            add_url "$BASE/llms.txt"
          fi

          if grep -Eq '^(data/evaluation/.*\.json|scripts/(reasoning-evaluation|benchmark-publication)\.mjs|docs/.*BENCHMARK.*|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/evals/"
            add_url "$BASE/ru/evals/"
            add_url "$BASE/data/benchmark-manifest.json"
            add_url "$BASE/data/reasoning-benchmark.json"
            add_url "$BASE/data/reasoning-evaluation.json"
            add_url "$BASE/api/v1/evals/reasoning-routing.json"
            add_url "$BASE/llms.txt"
          fi

          if grep -Eq '^(data/(contrasts|contrast-extensions)\.json|scripts/(contrast-library|contrast-growth)\.mjs|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/contrasts/"
            add_url "$BASE/ru/contrasts/"
            if [[ -f data/contrasts.json ]]; then
              while IFS= read -r contrast_id; do
                [[ -z "$contrast_id" ]] && continue
                add_url "$BASE/en/contrasts/$contrast_id/"
                add_url "$BASE/ru/contrasts/$contrast_id/"
              done < <(jq -r '.items[].id' data/contrasts.json)
            fi
            if [[ -f data/contrast-extensions.json ]]; then
              while IFS= read -r contrast_id; do
                [[ -z "$contrast_id" ]] && continue
                add_url "$BASE/en/contrasts/$contrast_id/"
                add_url "$BASE/ru/contrasts/$contrast_id/"
              done < <(jq -r '.pair_items[].id, .grammar_items[].id' data/contrast-extensions.json)
            fi
            add_url "$BASE/data/contrasts.json"
            add_url "$BASE/api/v1/contrasts.json"
            add_url "$BASE/data/grammar-contrasts.json"
            add_url "$BASE/api/v1/grammar-contrasts.json"
          fi

          if grep -Eq '^(data/russian-speaker-errors\.json|data/reasoning-frames/russian-transfer-extension-v2\.json|scripts/russian-transfer-guide\.mjs|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/mistakes/russian-speakers/"
            add_url "$BASE/ru/mistakes/russian-speakers/"
            if [[ -f data/russian-speaker-errors.json ]]; then
              while IFS= read -r slug; do
                [[ -z "$slug" ]] && continue
                add_url "$BASE/en/mistakes/russian-speakers/$slug/"
                add_url "$BASE/ru/mistakes/russian-speakers/$slug/"
              done < <(jq -r '.items[].slug' data/russian-speaker-errors.json)
              while IFS= read -r pattern_id; do
                [[ -z "$pattern_id" ]] && continue
                pattern_slug="$(tr '[:upper:]' '[:lower:]' <<<"$pattern_id")"
                add_url "$BASE/en/practice/$pattern_slug/"
                add_url "$BASE/ru/practice/$pattern_slug/"
                add_url "$BASE/api/v1/patterns/$pattern_slug.json"
              done < <(jq -r '.items[].pattern_id' data/russian-speaker-errors.json)
            fi
            add_url "$BASE/data/russian-speaker-errors.json"
            add_url "$BASE/api/v1/russian-speaker-errors.json"
            add_url "$BASE/api/v1/patterns.json"
            add_url "$BASE/en/practice/set/rtr/"
            add_url "$BASE/ru/practice/set/rtr/"
          fi

          if grep -Eq '^(data/partnership-opportunities\.json|scripts/discovery-growth\.mjs)' <<<"$CHANGED"; then
            add_url "$BASE/en/support/"
            add_url "$BASE/ru/support/"
            add_url "$BASE/data/partnership-opportunities.json"
          fi

          if grep -Eq '^(src/(render|i18n|site)\.mjs|scripts/release-contracts\.mjs|README\.md|docs/PRODUCT_DIRECTION\.md|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/"
            add_url "$BASE/ru/"
            add_url "$BASE/en/method/"
            add_url "$BASE/ru/method/"
            add_url "$BASE/en/roadmap/"
            add_url "$BASE/ru/roadmap/"
            add_url "$BASE/en/support/"
            add_url "$BASE/ru/support/"
          fi

          if grep -Eq '^(LICENSE|LICENSING\.md|CITATION\.cff|docs/(PUBLICATION_BOUNDARY|RESEARCH_USE)\.md|scripts/(patch-licensing|publication-readiness)\.mjs|src/provenance\.mjs|\.github/workflows/indexnow\.yml)' <<<"$CHANGED"; then
            add_url "$BASE/en/licensing/"
            add_url "$BASE/ru/licensing/"
            add_url "$BASE/en/cite/"
            add_url "$BASE/ru/cite/"
            add_url "$BASE/en/about/"
            add_url "$BASE/ru/about/"
            add_url "$BASE/en/legal/terms/"
            add_url "$BASE/ru/legal/terms/"
            add_url "$BASE/data/publication.json"
            add_url "$BASE/api/v1/publication.json"
            add_url "$BASE/CITATION.cff"
            add_url "$BASE/llms.txt"
          fi

          if grep -Eq '^(docs/RESEARCH|scripts/(enhance-research|research-pilot)|data/research)' <<<"$CHANGED"; then
            add_url "$BASE/en/research/"
            add_url "$BASE/ru/research/"
          fi

          if ((${#URLS[@]} == 0)); then
            echo "No search-facing URLs mapped from the deployed change range."
            exit 0
          fi

          printf '%s\n' "${URLS[@]}" | jq -R . | jq -s \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "$BASE/${KEY}.txt" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:.}' > indexnow.json

          echo "Submitting ${#URLS[@]} unique URLs to IndexNow."
          cat indexnow.json
          curl --retry 2 --fail-with-body \
            -H 'Content-Type: application/json; charset=utf-8' \
            -X POST --data @indexnow.json \
            https://api.indexnow.org/indexnow
