name: Apply connectivity canonicalization

on:
  push:
    branches: [fix/dedupe-structural-patterns]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/apply-connectivity-canonicalization.mjs
      - name: Commit connectivity integration
        run: |
          if [ -z "$(git status --porcelain -- scripts/connectivity.mjs)" ]; then
            echo "Connectivity integration is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/connectivity.mjs
          git commit -m "build: canonicalize pattern connectivity"
          git push origin HEAD:${GITHUB_REF_NAME}
