name: Grammar flexibility integration
on:
  push:
    branches: [feat/grammar-flexibility-300]
    paths:
      - scripts/integrate-grammar-flexibility.mjs
      - scripts/repair-grammar-integration.mjs
      - scripts/reconcile-curriculum-tests.mjs
      - scripts/register-pending-grammar-annotations.mjs
      - .github/workflows/grammar-flexibility-integration.yml
permissions:
  contents: write
concurrency:
  group: grammar-flexibility-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/grammar-flexibility-300
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Repair integration metadata and grammar-audit false positives
        run: node scripts/repair-grammar-integration.mjs
      - name: Reconcile stale pre-deduplication test assumptions with preserved identities
        run: node scripts/reconcile-curriculum-tests.mjs
      - name: Integrate canonical data and editorial corrections
        run: node scripts/integrate-grammar-flexibility.mjs
      - name: Register pending annotations without changing existing Marks
        run: node scripts/register-pending-grammar-annotations.mjs
      - name: Register new SEO routes and preserve every existing slug
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const file='data/seo-slugs.json';
          const before=JSON.parse(fs.readFileSync(file,'utf8'));
          execFileSync(process.execPath,['scripts/generate-seo-slugs.mjs'],{stdio:'inherit'});
          const after=JSON.parse(fs.readFileSync(file,'utf8'));
          for(const section of ['studySets','patterns']) for(const [id,slug] of Object.entries(before[section])) assert.equal(after[section][id],slug,`${section}/${id}: existing URL changed`);
          JS
      - name: Validate loader and record counts
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import assert from 'node:assert/strict';
          import { loadContent } from './src/content.mjs';
          const c=loadContent();
          const patterns=c.advancedPatterns;
          const added=patterns.filter(p=>/^GF[A-O]\d{3}$/.test(p.id));
          assert.equal(added.length,300);
          let sentences=0;
          for(const p of added) for(const l of p.langs) {
            const all=[{text:l.example,translation_ru:l.translation},...l.examples];
            assert.ok(all.length>=3,`${p.id}/${l.lang}: insufficient examples`);
            assert.equal(new Set(all.map(e=>e.text.trim().toLowerCase())).size,all.length,`${p.id}/${l.lang}: duplicate examples`);
            for(const e of all){assert.ok(e.text.trim());assert.match(e.translation_ru,/\p{Script=Cyrillic}/u);}
            sentences+=all.length;
          }
          const annotations=JSON.parse(zlib.gunzipSync(fs.readFileSync('data/pattern-annotations.json.gz')).toString('utf8'));
          const pending=Object.entries(annotations.items).filter(([key,record])=>/^GF[A-O]\d{3}:/.test(key)&&record.validation?.status==='pending').length;
          const totals={patterns:patterns.length,study_sets:c.studySets.sets.length,new_patterns:added.length,new_language_examples:sentences,new_example_pairs:sentences/2,new_pending_annotations:pending};
          console.log('GRAMMAR_INTEGRATION '+JSON.stringify(totals));
          fs.mkdirSync('docs/research',{recursive:true});
          fs.writeFileSync('docs/research/grammar-flexibility-300-integration.md', '# Grammar flexibility integration\n\nMachine-checked canonical loader totals (2026-09-18):\n\n```json\n'+JSON.stringify(totals,null,2)+'\n```\n\nThe 300 additions contain English and German formulas, three aligned example scenarios, Russian translations and Russian grammatical explanations. CEFR B2/C1 labels are editorial practice targets, not examination certification.\n\n## Annotation status\n\nNew examples are text-only records with empty spans and explicit `validation.status: pending`, `needs_rebuild: true`, `generator: none`, and a SHA-256 fingerprint of the current text. These are NOT completed parser annotations or human-reviewed Marks. Existing annotation records are preserved without modification. The canonical card export retains pending status. Run the local annotation pipeline to replace pending records with real annotations; reject stale fingerprints after text edits. The compressed export record count includes both completed and pending records and must not be presented as the count of annotated sentences.\n\n## Verification repairs\n\nThe similarity tokenizer retains one-letter grammatical words, preserving the difference between `few` and `a few`. The agreement detector recognizes irrealis `were` immediately after `as if` or `as though`, without ignoring genuine agreement errors. Positive and negative regression fixtures cover these corrections.\n\nObsolete tests still demanded thousands of physically deleted contextual duplicates and exactly 94 sets. Current tests instead check exact canonical membership, all 300 expected additions, the unchanged frozen SHA-256 identity/URL mapping for the 630 established patterns, retired-alias resolution and additive set preservation. Historical duplicate detection remains covered by explicit synthetic fixtures, not restored duplicate pages. No quality baseline, threshold or frozen identity fixture is rewritten.\n\n## Remaining editorial work\n\nExpand the new patterns to the requested 5–7 examples per language. This merge does not claim that requirement is complete.\n\nThis report is committed only after the full build and test suite succeeds. Existing SEO slugs, including historical alias names, are checked for preservation during integration.\n');
          JS
      - name: Verify complete site and tests before committing
        run: |
          if npm run verify > /tmp/grammar-verify.log 2>&1; then
            tail -n 25 /tmp/grammar-verify.log
          else
            grep -E '^(✖|ℹ tests|ℹ pass|ℹ fail|ℹ skipped|ℹ duration)' /tmp/grammar-verify.log || true
            grep -n -A 14 -B 2 -E '^not ok|^Error:|AssertionError|TypeError|ReferenceError|error:' /tmp/grammar-verify.log || true
            tail -n 60 /tmp/grammar-verify.log
            exit 1
          fi
      - name: Commit verified integrated source on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/patterns/GF*.json data/practice-extensions.json data/pattern-annotations.json.gz data/seo-slugs.json scripts/integrate-grammar-flexibility.mjs src/frame-quality-audit.mjs docs/research/grammar-flexibility-300-integration.md
          git add tests/api.test.mjs tests/connectivity.test.mjs tests/public-learning.test.mjs tests/publication-boundary.test.mjs tests/quality.test.mjs tests/reasoning.test.mjs tests/pattern-example-quality.test.mjs tests/frame-variants.test.mjs tests/pattern-shards.test.mjs tests/frame-quality-baseline.test.mjs tests/frame-quality-audit.test.mjs tests/frame-quality-classification.test.mjs tests/study-set-preservation.test.mjs tests/seo-pattern-slugs.test.mjs tests/practice-annotations.test.mjs tests/pattern-indexability.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'content: integrate 300 grammar patterns with preserved canonical identities and pending annotations'
            git push origin HEAD:feat/grammar-flexibility-300
          fi
