name: Grammar flexibility integration
on:
  push:
    branches: [feat/grammar-flexibility-300]
    paths:
      - scripts/integrate-grammar-flexibility.mjs
      - scripts/register-pending-grammar-annotations.mjs
      - .github/workflows/grammar-flexibility-integration.yml
permissions:
  contents: write
concurrency:
  group: grammar-flexibility-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/grammar-flexibility-300
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Repair the one-off integrator
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const file = 'scripts/integrate-grammar-flexibility.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const oldGroup = 'if (groups) p.group_id=family;';
          const newGroup = 'p.group_id=family;';
          assert.ok(source.includes(oldGroup) || source.includes(newGroup), 'Unexpected integrator; refuse a blind patch');
          source = source.replace(oldGroup, newGroup);
          const oldNote = "p.logic.metaphor_ru += ' В немецком естественно meine beiden Eltern и ihre beiden Vorschläge; для alle сохраняется alle unsere Dateien.';";
          if (!source.includes("if (!p.logic.metaphor_ru.includes('meine beiden Eltern'))")) source = source.replace(oldNote, "if (!p.logic.metaphor_ru.includes('meine beiden Eltern')) " + oldNote);
          const marker = "if(p.id==='GFH018')";
          if (!source.includes("if(p.id==='GFL008')")) {
            assert.ok(source.includes(marker));
            source = source.replace(marker, "if(p.id==='GFL008') p.langs.find(l=>l.lang==='de').formula='Subject + finite verb in second position + ... + wh-phrase + remaining verb parts?';\n  " + marker);
          }
          fs.writeFileSync(file, source);
          JS
      - name: Integrate canonical data and editorial corrections
        run: node scripts/integrate-grammar-flexibility.mjs
      - name: Register pending annotations without changing existing Marks
        run: node scripts/register-pending-grammar-annotations.mjs
      - name: Validate loader and record counts
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import assert from 'node:assert/strict';
          import { loadContent } from './src/content.mjs';
          const c=loadContent();
          const patterns=c.advancedPatterns;
          const added=patterns.filter(p=>/^GF[A-O]\d{3}$/.test(p.id));
          assert.equal(added.length,300);
          let sentences=0;
          for(const p of added) for(const l of p.langs) {
            const all=[{text:l.example,translation_ru:l.translation},...l.examples];
            assert.ok(all.length>=3,`${p.id}/${l.lang}: insufficient examples`);
            assert.equal(new Set(all.map(e=>e.text.trim().toLowerCase())).size,all.length,`${p.id}/${l.lang}: duplicate examples`);
            for(const e of all){assert.ok(e.text.trim());assert.match(e.translation_ru,/\p{Script=Cyrillic}/u);}
            sentences+=all.length;
          }
          const annotations=JSON.parse(zlib.gunzipSync(fs.readFileSync('data/pattern-annotations.json.gz')).toString('utf8'));
          const pending=Object.entries(annotations.items).filter(([key,record])=>/^GF[A-O]\d{3}:/.test(key)&&record.validation?.status==='pending').length;
          const totals={patterns:patterns.length,study_sets:c.studySets.sets.length,new_patterns:added.length,new_language_examples:sentences,new_example_pairs:sentences/2,new_pending_annotations:pending};
          console.log('GRAMMAR_INTEGRATION '+JSON.stringify(totals));
          fs.mkdirSync('docs/research',{recursive:true});
          fs.writeFileSync('docs/research/grammar-flexibility-300-integration.md', '# Grammar flexibility integration\n\nMachine-checked canonical loader totals (2026-09-18):\n\n```json\n'+JSON.stringify(totals,null,2)+'\n```\n\nThe 300 additions contain English and German formulas, three aligned example scenarios, Russian translations and Russian grammatical explanations. CEFR B2/C1 labels are editorial practice targets, not examination certification.\n\n## Annotation status\n\nNew examples are published as text-only records with empty spans and explicit `validation.status: pending`, `needs_rebuild: true`, `generator: none`, and a SHA-256 fingerprint of the current text. They are NOT completed parser annotations or human-reviewed grammar Marks. Existing annotation records are preserved without modification. The canonical card export retains pending status. Run the local annotation pipeline to replace pending records with real annotations; reject stale fingerprints after text edits. The compressed export record count includes both completed and pending records and must not be presented as the count of annotated sentences.\n\n## Remaining editorial work\n\nExpand the new patterns to the requested 5–7 examples per language. This merge does not claim that requirement is complete.\n\nThis report is committed only after the full build and test suite succeeds.\n');
          JS
      - name: Verify complete site and tests before committing
        run: |
          if npm run verify > /tmp/grammar-verify.log 2>&1; then
            tail -n 25 /tmp/grammar-verify.log
          else
            grep -n -E 'Error|error|not ok|failed|failure|AssertionError' /tmp/grammar-verify.log || true
            tail -n 140 /tmp/grammar-verify.log
            exit 1
          fi
      - name: Commit integrated source data on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/patterns/GF*.json data/practice-extensions.json data/pattern-annotations.json.gz scripts/integrate-grammar-flexibility.mjs docs/research/grammar-flexibility-300-integration.md
          if ! git diff --cached --quiet; then
            git commit -m 'content: register 300 grammar patterns and explicit pending annotations'
            git push origin HEAD:feat/grammar-flexibility-300
          fi
