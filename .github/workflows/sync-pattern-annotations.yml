name: Sync pattern annotations after tail cleanup

on:
  push:
    branches: [fix/remove-generated-example-tails]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-practice-annotations-after-tail-cleanup.mjs
      - name: Commit synchronized annotation layer
        run: |
          if git diff --quiet -- data/pattern-annotations.json.gz; then
            echo "Practice annotation layer already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pattern-annotations.json.gz
          git commit -m "data: sync practice annotations after tail cleanup"
          git push origin HEAD:${GITHUB_REF_NAME}
