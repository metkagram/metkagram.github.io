name: ARWP validation

on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'knowledge/**'
      - 'data/**'
      - 'api/**'
      - 'remote-mcp/**'
      - 'growth/**'
      - 'llms.txt'
      - 'scripts/apply-arwp.mjs'
      - 'scripts/stages/render.mjs'
      - '.github/workflows/arwp.yml'
      - '.github/workflows/arwp-growth.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'knowledge/**'
      - 'data/**'
      - 'api/**'
      - 'remote-mcp/**'
      - 'growth/**'
      - 'llms.txt'
      - 'scripts/apply-arwp.mjs'
      - 'scripts/stages/render.mjs'
      - '.github/workflows/arwp.yml'
      - '.github/workflows/arwp-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Agent-Ready Web Profile
        uses: dkharlanau/agent-ready-web-profile@a60be6a057f6ffe07a85ed884e89c91d2d4d740f
        with:
          profile: ai/site-profile.json
