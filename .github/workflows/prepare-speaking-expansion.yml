name: Prepare speaking expansion
on:
  push:
    branches: [content/speaking-frames-100-20260918]
    paths: [.github/workflows/prepare-speaking-expansion.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded auditor correction
        run: |
          set -euo pipefail
          mkdir -p .tmp/speaking-expansion
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const file='src/frame-quality-audit.mjs';
          let source=fs.readFileSync(file,'utf8');
          const imported='import { detectEnglishAgreement } from "./english-agreement-audit.mjs";';
          if(!source.includes(imported)) {
            const start=source.indexOf('function detectEnglishAgreement(text) {');
            const end=source.indexOf('function detectGermanAgreement(text) {',start);
            assert.ok(start>0 && end>start);
            source=imported+'\n\n'+source.slice(0,start)+source.slice(end);
            fs.writeFileSync(file,source);
          }
          NODE
          node --test tests/english-agreement-audit.test.mjs tests/speaking-expansion.test.mjs tests/pattern-shards.test.mjs tests/practice-annotations.test.mjs tests/pattern-editorial-copy.test.mjs tests/pattern-example-enrichment.test.mjs 2>&1 | tee .tmp/speaking-expansion/targeted-tests.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frame-quality-audit.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Use conservative clause-local English agreement audit'
            git push origin HEAD:content/speaking-frames-100-20260918
          fi
      - name: Full verification with explicit exit status
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm run verify 2>&1 | tee .tmp/speaking-expansion/verify.log
          verify_status=${PIPESTATUS[0]}
          npm test 2>&1 | tee .tmp/speaking-expansion/all-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          printf '{"verify_exit_code":%s,"test_exit_code":%s}\n' "$verify_status" "$test_status" > .tmp/speaking-expansion/exit-codes.json
          if [ "$verify_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then exit 1; fi
      - name: Archive source and proof
        if: always()
        run: |
          git rev-parse HEAD > .tmp/speaking-expansion/source-commit.txt
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.tmp -czf /tmp/metkagram-editorial-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speaking-expansion-review
          path: .tmp/speaking-expansion/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metkagram-editorial-source
          path: /tmp/metkagram-editorial-source.tar.gz
          retention-days: 7
