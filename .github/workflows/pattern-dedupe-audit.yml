name: Pattern structural duplicate audit

on:
  push:
    branches: [fix/dedupe-structural-patterns]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/pattern-structural-dedupe-audit.mjs
