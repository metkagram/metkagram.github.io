name: Deduplicate Pattern Corpus

on:
  push:
    branches:
      - fix/deduplicate-pattern-corpus
    paths:
      - scripts/deduplicate-pattern-corpus.mjs
      - scripts/migrate-retired-pattern-references.mjs
      - .github/workflows/deduplicate-pattern-corpus.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - name: Deduplicate canonical Pattern corpus
        run: node scripts/deduplicate-pattern-corpus.mjs
      - name: Migrate retired Pattern references
        run: node scripts/migrate-retired-pattern-references.mjs
      - name: Verify migrated repository
        run: npm run verify

      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Deduplicate structural pattern corpus"
          git push origin "HEAD:${GITHUB_REF_NAME}"
